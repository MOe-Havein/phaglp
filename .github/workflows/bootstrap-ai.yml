name: Bootstrap AI Governance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "nexus-forge-bot"
          git config user.email "nexus-forge@users.noreply.github.com"

      - name: Create AI Branch
        shell: bash
        run: |
          git fetch origin || true

          if git ls-remote --heads origin ai | grep -q ai; then
            git checkout ai
            git pull origin ai
          else
            git checkout -b ai
          fi

      - name: Create Directories
        run: |
          mkdir -p .ai
          mkdir -p docs/ai
          mkdir -p docs/architecture

      - name: Create AGENT_RULES.md
        run: |
          echo "# PHAGLP AI Engineering Rules" > .ai/AGENT_RULES.md
          echo "" >> .ai/AGENT_RULES.md
          echo "Feature-first architecture required." >> .ai/AGENT_RULES.md
          echo "Server Components by default." >> .ai/AGENT_RULES.md
          echo "Never use any." >> .ai/AGENT_RULES.md

      - name: Create ARCHITECTURE_CONTRACT.md
        run: |
          echo "# PHAGLP Architecture Contract" > docs/architecture/ARCHITECTURE_CONTRACT.md
          echo "" >> docs/architecture/ARCHITECTURE_CONTRACT.md
          echo "Canonical structure:" >> docs/architecture/ARCHITECTURE_CONTRACT.md
          echo "src/features" >> docs/architecture/ARCHITECTURE_CONTRACT.md

      - name: Create agent-boundaries.json
        run: |
          cat > .ai/agent-boundaries.json <<EOF
          {
            "allowed_write_paths": [
              "src/features/**",
              "src/components/ui/**",
              "docs/**",
              ".ai/**"
            ],
            "protected_paths": [
              "middleware.ts",
              "prisma/schema.prisma"
            ]
          }
          EOF

      - name: Create AI_ROADMAP.md
        run: |
          echo "# PHAGLP AI Roadmap" > docs/ai/AI_ROADMAP.md
          echo "" >> docs/ai/AI_ROADMAP.md
          echo "Phase 1: Architecture stabilization" >> docs/ai/AI_ROADMAP.md

      - name: Commit Files
        run: |
          git add .ai
          git add docs

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ai): bootstrap governance"
          fi

      - name: Push AI Branch
        run: |
          git push origin ai
