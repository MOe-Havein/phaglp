name: Bootstrap AI Governance

on:
workflow_dispatch:

permissions:
contents: write

jobs:
bootstrap-ai:
runs-on: ubuntu-latest

steps:
  ########################################################
  # CHECKOUT
  ########################################################

  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  ########################################################
  # CONFIGURE GIT
  ########################################################

  - name: Configure Git
    run: |
      git config user.name "nexus-forge-bot"
      git config user.email "nexus-forge@users.noreply.github.com"

  ########################################################
  # CREATE / SWITCH TO AI BRANCH
  ########################################################

  - name: Create AI Branch
    shell: bash
    run: |
      git fetch origin || true

      if git ls-remote --heads origin ai | grep -q ai; then
        echo "AI branch exists"

        git checkout ai
        git pull origin ai
      else
        echo "Creating AI branch"

        git checkout -b ai
      fi

  ########################################################
  # CREATE DIRECTORIES
  ########################################################

  - name: Create AI Directories
    run: |
      mkdir -p .ai
      mkdir -p docs/ai
      mkdir -p docs/architecture

  ########################################################
  # CREATE AGENT_RULES.md
  ########################################################

  - name: Create AGENT_RULES.md
    shell: bash
    run: |
      printf '%s\n' \
      '# PHAGLP AI Engineering Rules' \
      '' \
      '## Core Principle' \
      '' \
      'All new business features must be implemented as isolated feature modules.' \
      '' \
      'Never place new business logic directly into:' \
      '- src/components' \
      '- src/app' \
      '- src/lib' \
      '' \
      'unless the code is truly global/shared infrastructure.' \
      '' \
      '---' \
      '' \
      '# Feature Module Structure' \
      '' \
      'src/features/{feature-name}' \
      '' \
      '- components' \
      '- hooks' \
      '- actions' \
      '- services' \
      '- validations' \
      '- types' \
      '- constants' \
      '' \
      '---' \
      '' \
      '# App Router Rules' \
      '' \
      '- Server Components by default' \
      '- Client Components only when required' \
      '- Route handlers must stay thin' \
      '' \
      '---' \
      '' \
      '# TypeScript Rules' \
      '' \
      '- Strict typing required' \
      '- Never use any' \
      '- Zod validation required' \
      > .ai/AGENT_RULES.md

  ########################################################
  # CREATE ARCHITECTURE CONTRACT
  ########################################################

  - name: Create ARCHITECTURE_CONTRACT.md
    shell: bash
    run: |
      printf '%s\n' \
      '# PHAGLP Architecture Contract' \
      '' \
      '## Canonical Architecture' \
      '' \
      'src/' \
      '├── app' \
      '├── components' \
      '│   ├── ui' \
      '│   └── shared' \
      '├── features' \
      '├── hooks' \
      '├── lib' \
      '├── services' \
      '├── types' \
      '└── validations' \
      '' \
      '## Core Rules' \
      '' \
      '- Feature-first architecture' \
      '- App Router only' \
      '- Server Components by default' \
      '- Thin route handlers' \
      '- Typed services' \
      '- Zod validation required' \
      > docs/architecture/ARCHITECTURE_CONTRACT.md

  ########################################################
  # CREATE AGENT BOUNDARIES
  ########################################################

  - name: Create agent-boundaries.json
    shell: bash
    run: |
      cat > .ai/agent-boundaries.json <<EOF
      {
        "allowed_write_paths": [
          "src/features/**",
          "src/components/ui/**",
          "src/hooks/**",
          "src/types/**",
          "docs/**",
          ".ai/**"
        ],
        "protected_paths": [
          "middleware.ts",
          "next.config.ts",
          "next.config.mjs",
          "prisma/schema.prisma"
        ],
        "forbidden_paths": [
          ".env",
          ".env.local",
          "pnpm-lock.yaml"
        ]
      }
      EOF

  ########################################################
  # CREATE AI ROADMAP
  ########################################################

  - name: Create AI_ROADMAP.md
    shell: bash
    run: |
      printf '%s\n' \
      '# PHAGLP AI Roadmap' \
      '' \
      '## Phase 1' \
      '- Architecture stabilization' \
      '- Feature module migration' \
      '- Shared service extraction' \
      '- AI governance' \
      '' \
      '## Phase 2' \
      '- RBAC architecture' \
      '- Dashboard shell' \
      '- Data table system' \
      > docs/ai/AI_ROADMAP.md

  ########################################################
  # COMMIT FILES
  ########################################################

  - name: Commit AI Governance Files
    shell: bash
    run: |
      git add .ai
      git add docs/ai
      git add docs/architecture

      git status

      if git diff --cached --quiet; then
        echo "No changes to commit"
      else
        git commit -m "chore(ai): bootstrap governance system"
      fi

  ########################################################
  # PUSH AI BRANCH
  ########################################################

  - name: Push AI Branch
    run: |
      git push origin ai

