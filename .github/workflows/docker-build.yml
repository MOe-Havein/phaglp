name: Build Docker Image

on:
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false # Set to true and add login steps if pushing to a registry
          build-args: |
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=phaglp
