name: NEXUS-FORGE Execute

on:
  workflow_dispatch:
    inputs:
      task_name:
        description: "AI task name"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  nexus-forge:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}

    steps:
      ########################################################
      # CHECKOUT
      ########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ########################################################
      # PNPM + NODE
      ########################################################

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      ########################################################
      # INSTALL
      ########################################################

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      ########################################################
      # CREATE AI BRANCH
      ########################################################

      - name: Generate Branch Name
        id: branch
        shell: bash
        run: |
          SAFE_TASK=$(echo "${{ github.event.inputs.task_name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | tr ' ' '-')

          BRANCH_NAME="ai/${SAFE_TASK}-$(date +%s)"

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Branch
        run: git checkout -b "${{ steps.branch.outputs.branch_name }}"

      ########################################################
      # PLACEHOLDER AI EXECUTION STEP
      ########################################################

      - name: AI Execution Placeholder
        shell: bash
        run: |
          echo "Run Antigravity CLI or AI tooling here"

          mkdir -p docs/ai-runs

          {
            echo "# AI Run"
            echo ""
            echo "Task: ${{ github.event.inputs.task_name }}"
            echo "Generated at: $(date)"
          } > docs/ai-runs/run.md

      - name: Validate Environment
        run: pnpm tsx src/env.ts

      ########################################################
      # FORMAT
      ########################################################

      - name: Run Prettier
        run: pnpm format

      ########################################################
      # TYPECHECK
      ########################################################

      - name: Run TypeScript Check
        run: pnpm typecheck

      ########################################################
      # BUILD VALIDATION
      ########################################################

      - name: Run Production Build
        run: pnpm build

      ########################################################
      # DETECT CHANGED FILES
      ########################################################

      - name: Get Changed Files
        id: changed-files
        shell: bash
        run: |
          git diff --name-only > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

      ########################################################
      # SECURITY CHECK
      ########################################################

      - name: Check Forbidden Paths
        shell: bash
        run: |
          FORBIDDEN_PATHS=(
            ".github/workflows/deploy"
            ".github/workflows/production"
            ".github/workflows/release"
            "pnpm-lock.yaml"
            ".env"
            ".env.local"
      
            "middleware.ts"
            "prisma/schema.prisma"
          )

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            for forbidden in "${FORBIDDEN_PATHS[@]}"; do
              # Exact match check handles paths safely without substring mistakes
              if [[ "$file" == "$forbidden" ]]; then
                echo "❌ Forbidden file modification detected: $file"
                exit 1
              fi
            done
          done < changed-files.txt
