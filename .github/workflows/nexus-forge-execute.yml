name: NEXUS-FORGE Execute

on:
  workflow_dispatch:
    inputs:
      task_name:
        description: AI task name
        required: true
        default: dev
        type: string

permissions:
  contents: write
  pull-requests: write


jobs:
  nexus-forge:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}

    steps:
      ########################################################
      # CHECKOUT
      ########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      ########################################################
      # PNPM + NODE
      ########################################################

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      ########################################################
      # INSTALL
      ########################################################

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      ########################################################
      # BRANCH NAME
      ########################################################

      - name: Generate Branch Name
        id: branch
        run: |
          SAFE_TASK=$(echo "${{ github.event.inputs.task_name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | tr ' ' '-')

          echo "branch_name=ai/${SAFE_TASK}-$(date +%s)" >> "$GITHUB_OUTPUT"

      ########################################################
      # AI EXECUTION
      ########################################################

      - name: AI Execution Placeholder
        run: |
          mkdir -p docs/ai-runs

          cat > docs/ai-runs/run.md << EOF
          # AI Run

          Task: ${{ github.event.inputs.task_name }}

          Generated at: $(date -u)
          EOF

      ########################################################
      # FORMAT (optional)
      ########################################################

      - name: Run Prettier
        run: pnpm format
        continue-on-error: true

      ########################################################
      # TYPECHECK (optional)
      ########################################################

      - name: Run Typecheck
        run: pnpm typecheck
        continue-on-error: true

      ########################################################
      # BUILD
      ########################################################

      - name: Production Build
        run: pnpm build

      ########################################################
      # DETECT CHANGES
      ########################################################

      - name: Check For Changes
        id: verify
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      ########################################################
      # BLOCK FORBIDDEN FILES
      ########################################################

      - name: Validate Allowed Paths
        if: steps.verify.outputs.has_changes == 'true'
        run: |
          git diff --cached --name-only > changed-files.txt

          FORBIDDEN_PATHS=(
            ".env"
            ".env.local"
            "middleware.ts"
            "prisma/schema.prisma"
          )

          while read -r FILE; do
            [ -z "$FILE" ] && continue

            for FORBIDDEN in "${FORBIDDEN_PATHS[@]}"; do
              if [[ "$FILE" == "$FORBIDDEN" ]]; then
                echo "Forbidden modification: $FILE"
                exit 1
              fi
            done
          done < changed-files.txt

      ########################################################
      # CREATE PR
      ########################################################

      - name: Create Pull Request
        if: steps.verify.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          branch: ${{ steps.branch.outputs.branch_name }}

          commit-message: |
            feat(ai): ${{ github.event.inputs.task_name }}

          title: |
            AI: ${{ github.event.inputs.task_name }}

          body: |
            ## NEXUS-FORGE Automated PR

            Generated automatically.

            ### Validation
            - Dependencies installed
            - Formatting attempted
            - Typecheck attempted
            - Build passed

            ### Review Required
            Human approval required before merge.

          delete-branch: true
