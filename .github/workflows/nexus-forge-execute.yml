
name: NEXUS-FORGE Execute

on:
  workflow_dispatch:
    inputs:
      task_name:
        description: 'AI task name'
        required: true
        default: 'dev'
        type: string
                                       
permissions:
  contents: write
  workflows: write 
  pull-requests: write

jobs:
  nexus-forge:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVsteps:
      ########################################################
      # CHECKOUT
      ########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ########################################################
      # PNPM + NODE
      ########################################################

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      ########################################################
      # INSTALL
      ########################################################

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      ########################################################
      # CREATE AI BRANCH
      ########################################################

      - name: Generate Branch Name
        id: branch
        run: |
          SAFE_TASK=$(echo "${{ github.event.inputs.task_name }}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
          BRANCH_NAME="ai/${SAFE_TASK}-$(date +%s)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create Branch
        run: |
          git checkout -b "${{ steps.branch.outputs.branch_name }}"

      ########################################################
      # PLACEHOLDER AI EXECUTION STEP
      ########################################################

      - name: AI Execution Placeholder
        run: |
          echo "Run Antigravity CLI or AI tooling here"
          mkdir -p docs/ai-runs
          echo "# AI Run" > docs/ai-runs/run.md
          echo "" >> docs/ai-runs/run.md
          echo "Task: ${{ github.event.inputs.task_name }}" >> docs/ai-runs/run.md
          echo "Generated at: $(date)" >> docs/ai-runs/run.md

      ########################################################
      # FORMAT
      ########################################################

      - name: Run Prettier
        run: pnpm format

      ########################################################
      # TYPECHECK
      ########################################################

      - name: Run TypeScript Check
        run: pnpm typecheck

      ########################################################
      # BUILD VALIDATION
      ########################################################

      - name: Run Production Build
        run: pnpm build

      ########################################################
      # DETECT CHANGED FILES
      ########################################################

      - name: Get Changed Files
        id: changed-files
        run: |
          git diff --name-only > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

      ########################################################
      # BLOCK DANGEROUS FILE MODIFICATIONS
      ########################################################

      - name: Validate Allowed Paths
        run: |
          FORBIDDEN_PATHS=(
            ".env"
            ".env.local"
            "middleware.ts"
            "prisma/schema.prisma"
          )

          while read -r FILE; do
            [ -z "$FILE" ] && continue
            for FORBIDDEN in "${FORBIDDEN_PATHS[@]}"; do
              if [[ "$FILE" == "$FORBIDDEN" ]]; then
                echo "❌ Forbidden file modification detected: $FILE"
                exit 1
              fi
            done
          done < changed-files.txt

      ########################################################
      # ENSURE CHANGES EXIST
      ########################################################
      - name: Check For Changes
        id: verify-changes
        run: |
          if git diff --quiet; then
            echo "No changes detected."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      ########################################################
      # COMMIT CHANGES
      ########################################################

      - name: Commit Changes
        if: steps.verify-changes.outputs.has_changes == 'true'
        run: |
          git config user.name "nexus-forge-bot"
          git config user.email "nexus-forge@users.noreply.github.com"
          git add .
          git commit -m "feat(ai): ${{ github.event.inputs.task_name }}"

      ########################################################
      # PUSH BRANCH
      ########################################################

      - name: Push Branch
        if: steps.verify-changes.outputs.has_changes == 'true'
        run: |
          git push origin "${{ steps.branch.outputs.branch_name }}"

      ########################################################
      # CREATE PULL REQUEST
      ########################################################

      - name: Create Pull Request
        if: steps.verify-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "${{ steps.branch.outputs.branch_name }}"
          title: "AI: ${{ github.event.inputs.task_name }}"
          body: |
            ## NEXUS-FORGE Automated PR

            This PR was generated automatically by NEXUS-FORGE.

            ### Validation Completed
            - pnpm install
            - prettier formatting
            - typecheck
            - production build

            ### Review Required
            Human review is mandatory before merge.

  
