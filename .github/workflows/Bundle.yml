name: Bundle Size

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: bundle-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-bundle:
    name: Analyze Next.js Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      ANALYZE: true
      CI: true

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Restore Next.js cache
      - name: Restore Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      # Install dependencies
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Verify analyzer dependency
      - name: Verify Bundle Analyzer Installed
        run: |
          pnpm list @next/bundle-analyzer

      # Build application with analyzer enabled
      - name: Build Application
        run: pnpm build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # Verify analysis output exists
      - name: Verify Analyzer Output
        run: |
          ls -la .next || true
          find .next -type f \( -name "*.html" -o -name "*.json" \) || true

      # Upload bundle analysis artifacts
      - name: Upload Bundle Analysis
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-bundle-analysis
          path: |
            .next/analyze
          if-no-files-found: warn
          compression-level: 9
          retention-days: 14

      # GitHub Actions summary
      - name: Create Build Summary
        run: |
          echo "## Next.js Bundle Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: Production" >> $GITHUB_STEP_SUMMARY
          echo "- Node Version: 20" >> $GITHUB_STEP_SUMMARY
          echo "- Package Manager: pnpm" >> $GITHUB_STEP_SUMMARY
          echo "- Analyzer Enabled: true" >> $GITHUB_STEP_SUMMARY
