name: Analyze Bundle Size

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  analyze-bundle:
    name: Analyze Next.js Bundle
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install dependencies
      - name: Install Dependencies
        run: npm install

      # Restore Next.js cache
      - name: Restore Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      # Install bundle analyzer
      - name: Install Bundle Analyzer
        run: npm install --save-dev @next/bundle-analyzer

      # Enable analyzer
      - name: Enable Bundle Analyzer
        run: |
          cat > next.config.mjs << 'EOF'
          import bundleAnalyzer from '@next/bundle-analyzer';

          const withBundleAnalyzer = bundleAnalyzer({
            enabled: process.env.ANALYZE === 'true',
          });

          /** @type {import('next').NextConfig} */
          const nextConfig = {
            reactStrictMode: true,
          };

          export default withBundleAnalyzer(nextConfig);
          EOF

      # Build project with analysis enabled
      - name: Build With Bundle Analysis
        env:
          ANALYZE: true
        run: npm run build

      # Upload bundle reports
      - name: Upload Bundle Reports
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-bundle-report
          path: |
            .next/analyze/
            .next/static/
          retention-days: 7
