name: Architecture Audit

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - dev
      - staging

jobs:
  architecture-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Directory Tree
        run: |
          sudo apt-get update
          sudo apt-get install -y tree

          tree -L 4 \
            -I 'node_modules|.next|dist|coverage|build|.git' \
            > architecture-tree.txt

      - name: Generate TypeScript File Map
        run: |
          find . \
            -type f \
            \( -name "*.ts" -o -name "*.tsx" \) \
            > typescript-files.txt

      - name: Analyze App Router Structure
        run: |
          find src/app -maxdepth 4 -type f \
            > app-router-map.txt || true

      - name: Analyze Feature Modules
        run: |
          find features -maxdepth 3 -type d \
            > feature-modules.txt || true

      - name: Detect Large Components
        run: |
          find . \
            -type f \
            \( -name "*.tsx" -o -name "*.ts" \) \
            -exec wc -l {} + \
            | sort -nr \
            | head -50 \
            > large-files-report.txt

      - name: Run Type Check
        run: |
          pnpm run type-check || \
          pnpm run typecheck || true

      - name: Run Lint
        run: pnpm run lint || true

      - name: Generate Dependency Graph
        run: |
          pnpm ls --depth Infinity \
            > dependency-graph.txt || true

      - name: Upload Architecture Reports
        uses: actions/upload-artifact@v4
        with:
          name: architecture-audit
          path: |
            architecture-tree.txt
            typescript-files.txt
            app-router-map.txt
            feature-modules.txt
            large-files-report.txt
            dependency-graph.txt
