name: Vercel Deploy & Track

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  vercel-deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Install dependencies
      - name: Install Dependencies
        run: npm install

      # Restore Next.js build cache
      - name: Restore Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      # Install Vercel CLI
      - name: Install Vercel CLI
        run: npm install -g vercel

      # Pull Vercel environment settings
      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_API_TOKEN }}

      # Build project artifacts
      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_API_TOKEN }}

      # Deploy to Vercel
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_API_TOKEN }}
