name: Analyze Bundle Size

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  analyze-bundle:
    name: Analyze Next.js Bundle
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Install dependencies
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Restore Next.js build cache
      - name: Restore Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      # Build with bundle analyzer enabled
      - name: Analyze Bundle Size
        env:
          ANALYZE: true
        run: pnpm build

      # Upload analysis artifacts
      - name: Upload Bundle Report
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-bundle-report
          path: |
            .next/analyze
            .next/static
          retention-days: 7
