name: Bootstrap AI Governance

on:
workflow_dispatch:

permissions:
contents: write

jobs:
bootstrap-ai:
runs-on: ubuntu-latest

steps:
  ########################################################
  # CHECKOUT
  ########################################################

  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  ########################################################
  # SETUP GIT
  ########################################################

  - name: Configure Git
    run: |
      git config user.name "nexus-forge-bot"
      git config user.email "nexus-forge@users.noreply.github.com"

  ########################################################
  # CREATE / SWITCH TO AI BRANCH
  ########################################################

  - name: Create AI Branch
    shell: bash
    run: |
      git fetch origin || true

      if git ls-remote --heads origin ai | grep ai; then
        echo "AI branch exists"

        git checkout ai
        git pull origin ai
      else
        echo "Creating AI branch"

        git checkout -b ai
      fi

  ########################################################
  # CREATE AI GOVERNANCE STRUCTURE
  ########################################################

  - name: Create AI Directories
    run: |
      mkdir -p .ai
      mkdir -p docs/ai
      mkdir -p docs/architecture

  ########################################################
  # AGENT RULES
  ########################################################

  - name: Create AGENT_RULES.md
    shell: bash
    run: |
      cat << 'EOF' > .ai/AGENT_RULES.md
      # PHAGLP AI Engineering Rules

      ## Core Principle

      All new business features must be implemented as isolated feature modules.

      Never place new business logic directly into:
      - src/components
      - src/app
      - src/lib

      unless the code is truly global/shared infrastructure.

      ---

      # Feature Module Structure

      Each feature must follow:

      src/features/{feature-name}

      - components
      - hooks
      - actions
      - services
      - validations
      - types
      - constants

      ---

      # App Router Rules

      - Server Components by default
      - Client Components only when required
      - No direct DB queries inside UI components
      - Route handlers must stay thin

      ---

      # TypeScript Rules

      - Strict typing required
      - Never use any
      - Zod validation required

      ---

      # Forbidden Operations

      Agents may NOT:
      - rewrite unrelated modules
      - delete infrastructure
      - modify deployment workflows
      - overwrite prisma schema
      - edit environment files

      EOF

  ########################################################
  # ARCHITECTURE CONTRACT
  ########################################################

  - name: Create ARCHITECTURE_CONTRACT.md
    shell: bash
    run: |
      cat << 'EOF' > docs/architecture/ARCHITECTURE_CONTRACT.md
      # PHAGLP Architecture Contract

      ## Canonical Architecture

      src/
      ├── app
      ├── components
      │   ├── ui
      │   └── shared
      ├── features
      ├── hooks
      ├── lib
      ├── services
      ├── types
      └── validations

      ## Core Rules

      - Feature-first architecture
      - App Router only
      - Server Components by default
      - Shared abstractions centralized
      - Thin route handlers
      - Typed services
      - Zod validation required
      - No oversized components

      ## AI Governance

      AI-generated code must:
      - preserve architecture integrity
      - avoid unrelated rewrites
      - avoid duplicate abstractions
      - remain modular
      - pass typecheck/build validation

      EOF

  ########################################################
  # AGENT BOUNDARIES
  ########################################################

  - name: Create agent-boundaries.json
    shell: bash
    run: |
      cat << 'EOF' > .ai/agent-boundaries.json
      {
        "allowed_write_paths": [
          "src/features/**",
          "src/components/ui/**",
          "src/hooks/**",
          "src/types/**",
          "docs/**",
          ".ai/**"
        ],

        "protected_paths": [
          "middleware.ts",
          "next.config.ts",
          "next.config.mjs",
          "prisma/schema.prisma",
          ".github/workflows/deploy.yml"
        ],

        "forbidden_paths": [
          ".env",
          ".env.local",
          "pnpm-lock.yaml"
        ]
      }
      EOF

  ########################################################
  # AI ROADMAP
  ########################################################

  - name: Create AI_ROADMAP.md
    shell: bash
    run: |
      cat << 'EOF' > docs/ai/AI_ROADMAP.md
      # PHAGLP AI Roadmap

      ## Phase 1
      - Architecture stabilization
      - Feature module migration
      - Shared service extraction
      - AI governance

      ## Phase 2
      - RBAC architecture
      - Dashboard shell
      - Data table system
      - Form abstraction system

      ## Phase 3
      - AI-assisted feature pipelines
      - Automated PR generation
      - Architecture enforcement

      EOF

  ########################################################
  # COMMIT ONLY AI FILES
  ########################################################

  - name: Commit AI Governance Files
    shell: bash
    run: |
      git add .ai
      git add docs/ai
      git add docs/architecture

      git status

      if git diff --cached --quiet; then
        echo "No changes to commit"
      else
        git commit -m "chore(ai): bootstrap governance system"
      fi

  ########################################################
  # PUSH AI BRANCH
  ########################################################

  - name: Push AI Branch
    run: |
      git push origin ai

