services:
  # Local PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: phaglp-db-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: phaglp_user
      POSTGRES_PASSWORD: phaglp_password
      POSTGRES_DB: phaglp_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phaglp_user -d phaglp_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - phaglp-db-data:/var/lib/postgresql/data

volumes:
  phaglp-db-data:
